# ModSecurity + OWASP CRS v4 — CSE804
# WAF Tuning Workflow:
#   1. Deploy in DetectionOnly mode
#   2. Collect 72h baseline logs
#   3. Identify false positives -> create exclusions
#   4. Switch to On (blocking)
#   5. Monitor daily

SecRuleEngine DetectionOnly   # Switch to: SecRuleEngine On  (after tuning)

SecRequestBodyAccess On
SecRequestBodyLimit 13107200
SecRequestBodyLimitAction Reject
SecResponseBodyAccess On
SecResponseBodyMimeType text/plain text/html application/json
SecResponseBodyLimit 524288

SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLog /var/log/modsec_audit.log
SecDebugLogLevel 0

# Anomaly scoring (OWASP CRS)
# CRITICAL=5, ERROR=4, WARNING=3 — block when total >= threshold
SecAction "id:900001,phase:1,nolog,pass,t:none,setvar:tx.paranoia_level=2"
SecAction "id:900110,phase:1,nolog,pass,t:none,setvar:tx.inbound_anomaly_score_threshold=5"

# Block SQL injection
SecRule ARGS "@detectSQLi" \
  "id:942100,phase:2,deny,status:403,log,\
   msg:'SQL Injection Attack',tag:'attack-sqli',severity:'CRITICAL'"

# Block XSS
SecRule REQUEST_BODY|ARGS "@detectXSS" \
  "id:941100,phase:2,deny,status:403,log,\
   msg:'XSS Attack Detected',tag:'attack-xss',severity:'CRITICAL'"

# Block path traversal
SecRule REQUEST_URI|ARGS "@rx (?:\.\./|\.\\\\)" \
  "id:930110,phase:2,deny,status:403,log,msg:'Path Traversal'"

# Block SSRF to cloud metadata
SecRule ARGS|REQUEST_BODY "@rx 169\.254\.169\.254|metadata\.google\.internal" \
  "id:934110,phase:2,deny,status:403,log,msg:'SSRF to Cloud Metadata Blocked'"

Include /usr/share/modsecurity-crs/crs-setup.conf
Include /usr/share/modsecurity-crs/rules/*.conf
