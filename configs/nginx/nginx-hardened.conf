# Hardened Nginx Reverse Proxy — CSE804
limit_req_zone  $binary_remote_addr zone=api:10m   rate=100r/s;
limit_req_zone  $binary_remote_addr zone=login:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=conn:10m;

server {
    listen 80; server_name app.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2; server_name app.example.com;

    ssl_certificate     /etc/ssl/certs/app.example.com.cert.pem;
    ssl_certificate_key /etc/ssl/private/app.example.com.key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on; ssl_stapling_verify on;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none';" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;

    # Strip information disclosure banners
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_hide_header X-AspNet-Version;

    # NEVER trust client-supplied X-Forwarded-For
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header Host              $host;
    proxy_set_header X-Forwarded-Proto $scheme;

    limit_conn conn 50;

    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass https://backend-pool;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/backend-ca.cert.pem;
    }

    location /auth/login {
        limit_req zone=login burst=3 nodelay;
        limit_req_status 429;
        proxy_pass https://backend-pool;
    }

    # Block common attack patterns
    location ~* "(union.*select|select.*from|insert.*into|drop.*table)" { deny all; }
    location ~* "\.\."  { deny all; }
    location ~* "\.(bak|sql|env|git)$" { deny all; return 404; }

    access_log /var/log/nginx/app-access.log;
    error_log  /var/log/nginx/app-error.log warn;
}

upstream backend-pool {
    least_conn;
    server 10.0.2.10:8443 max_fails=3 fail_timeout=30s;
    server 10.0.2.11:8443 max_fails=3 fail_timeout=30s;
}
