# Content Security Policy Examples — CSE804

# Report-Only first (deploy this, collect violations, then enforce)
add_header Content-Security-Policy-Report-Only "
  default-src 'self';
  script-src  'self';
  report-uri  /csp-violations;
" always;

# Level 1: Basic CSP
add_header Content-Security-Policy "
  default-src 'self';
  script-src  'self';
  style-src   'self';
  img-src     'self' data:;
  object-src  'none';
  frame-ancestors 'none';
  base-uri    'self';
  form-action 'self';
" always;

# Level 2: Nonce-based CSP (most secure for inline scripts)
# Generate unique nonce per request: $request_id
# add_header Content-Security-Policy "
#   default-src 'self';
#   script-src  'nonce-$csp_nonce' 'strict-dynamic';
#   object-src  'none';
#   frame-ancestors 'none';
# " always;

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
add_header X-Frame-Options           "DENY" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy  "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
